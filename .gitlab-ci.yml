stages:
  - test

variables:
  DJANGO_SETTINGS_MODULE: "taskflow.settings.development"

  POSTGRES_DB: "taskflow"
  POSTGRES_USER: "taskflow"
  POSTGRES_PASSWORD: "taskflow"

  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pypoetry"
 
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

  PYTHONPATH: "$CI_PROJECT_DIR/src"

cache:
  key:
    files:
      - poetry.lock

  paths:
    - .cache/pip
    - .cache/pypoetry

  policy: pull-push

before_script:
  - echo "$DOTENV_CONTENT" > src/taskflow/.env
  - pip install poetry==1.8.5
  - poetry install --no-interaction --no-ansi

test_job:
  stage: test

  image: python:3.12

  services:
    - name: postgres:16
      alias: db

    - name: redis:7
      alias: redis

  script:
    - poetry run python -c "import taskflow; print(taskflow.__path__)"
    - poetry run python src/manage.py shell -c "from django.apps import apps; print([a.name for a in apps.get_app_configs()])"
    - poetry run python src/manage.py test taskflow.accounts --verbosity=2
    - poetry run python src/manage.py test taskflow --verbosity=2 
