services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime  # اضافه کنید
    container_name: taskflow_web
    command: python src/manage.py runserver 0.0.0.0:8000
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
    ports:
      - "8000:8000"
    env_file:
      - ./src/taskflow/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: taskflow_db
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: taskflow_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: taskflow_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped

  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: taskflow_celery
    command: celery -A taskflow worker -l info
    volumes:
      - ./src:/app/src
    env_file:
      - ./src/taskflow/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: taskflow_celery_beat
    command: celery -A taskflow beat -l info
    volumes:
      - ./src:/app/src
    env_file:
      - ./src/taskflow/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data: